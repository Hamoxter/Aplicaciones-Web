
<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width">

    <title>Calculadora</title>

</head>

<body>

    <div class="contenedor">

        <h1>Calculadora</h1>

        <form>
            <!-- Formulario que contiene los imputs para ingresar los numeros -->


            <!-- Primer número -->
            <label>Primer número:</label>
            <input type="number" id="num1">
          

            <!-- Segundo número -->

            <label>Segundo número:</label>
            <input type="number" id="num2">
           
              <!-- Botón que ejecuta la función calcular() de JavaScript cuando el usuario hace clic -->
            <button type="button" onclick="calcular()">
                Calcular
            </button>


        </form>

    </div>

    <!-- Conecta este archivo HTML con el archivo JavaScript llamado script.js -->
     
    <script src="script.js"></script>
    

</body>

</html>
