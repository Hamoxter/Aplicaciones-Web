<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">

        <header>
            <h1>Registro de Estudiantes</h1>
            <p>Sistema de registro académico</p>
        </header>

        <section class="formulario">
            <h2>Datos del estudiante</h2>

            <form id="formulario">

                <div class="campos">

                    <div>
                        <label>Cédula:</label>
                        <input type="text" id="cedula" maxlength="10"
                        placeholder="Ingrese su cédula">
                    </div>

                    <div>
                        <label>Apellidos:</label>
                        <input type="text" id="apellidos"
                        placeholder="Ingrese sus apellidos">
                    </div>

                    <div>
                        <label>Nombres:</label>
                        <input type="text" id="nombres"
                        placeholder="Ingrese sus nombres">
                    </div>

                    <div>
                        <label>Dirección:</label>
                        <input type="text" id="direccion"
                        placeholder="Ingrese su dirección">
                    </div>

                    <div>
                        <label>Teléfono:</label>
                        <input type="text" id="telefono" maxlength="10"
                        placeholder="09XXXXXXXX">
                    </div>

                    <div>
                        <label>Correo electrónico:</label>
                        <input type="text" id="correo"
                        placeholder="ejemplo@correo.com">
                    </div>

                    <div>
                        <label>Facultad:</label>
                        <select id="facultad">
                            <option value="">Seleccione una facultad</option>
                            <option value="Ingeniería">Ingeniería</option>
                            <option value="Ciencias Administrativas">Ciencias Administrativas</option>
                            <option value="Ciencias de la Salud">Ciencias de la Salud</option>
                            <option value="Ciencias de la Educación">Ciencias de la Educación</option>
                            <option value="Ciencias Sociales">Ciencias Sociales</option>
                            <option value="Ciencias Agropecuarias">Ciencias Agropecuarias</option>
                        </select>
                    </div>

                    <div>
                        <label>Nivel:</label>
                        <select id="nivel">
                            <option value="">Seleccione el nivel</option>
                            <option value="1">Primer nivel</option>
                            <option value="2">Segundo nivel</option>
                            <option value="3">Tercer nivel</option>
                            <option value="4">Cuarto nivel</option>
                            <option value="5">Quinto nivel</option>
                            <option value="6">Sexto nivel</option>
                            <option value="7">Séptimo nivel</option>
                            <option value="8">Octavo nivel</option>
                            <option value="9">Noveno nivel</option>
                            <option value="10">Décimo nivel</option>
                        </select>
                    </div>

                    <div>
                        <label>Paralelo:</label>
                        <select id="paralelo">
                            <option value="">Seleccione el paralelo</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>

                </div>

                <button type="submit">Registrar estudiante</button>

            </form>
        </section>

        <section class="registros">

            <h2>Estudiantes registrados</h2>

            <p id="total">Total de estudiantes: 0</p>

            <div class="tabla">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Apellidos</th>
                            <th>Nombres</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Facultad</th>
                            <th>Nivel</th>
                            <th>Paralelo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="listaEstudiantes">
                    </tbody>
                </table>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
